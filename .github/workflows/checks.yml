name: Site candidate checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  site_boundary:
    name: Site candidate boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # locally inspected v7 pin; verify owner/version before activation
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check exact site candidate
        run: python -B .github/scripts/verify_release.py --check-candidate --checkout .

  hosted_fake_provider:
    name: Hosted publisher orchestration proof (fake provider)
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'opened' &&
      github.repository == 'humanityscharter/charter-site' && github.event.repository.id == 1434778050 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.sha == '3f4c62aba673d761dd95bbc34929daf06201adfa' &&
      github.run_attempt == '1' && github.head_ref == format('codex/hosted-proof-{0}', github.event.pull_request.head.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '1a310a5075053cb46eb9264a17c1c5fbf8c92a7b'
          path: control-subject
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1
      - name: Run reviewed Linux proof with fake provider responses
        shell: bash
        env:
          HC_EXPECTED_C_SHA: '1a310a5075053cb46eb9264a17c1c5fbf8c92a7b'
          HC_DIAGNOSTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HC_DIAGNOSTIC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HC_DIAGNOSTIC_MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export HC_DIAGNOSTIC_C_SHA="$(git -C "$GITHUB_WORKSPACE/control-subject" rev-parse HEAD)"
          test "$HC_DIAGNOSTIC_C_SHA" = "$HC_EXPECTED_C_SHA"
          python3 -I -S -B - <<'HC_BOOTSTRAP'
          import base64, hashlib, os, stat
          from pathlib import Path
          expected = {".github/scripts/freeze_release.py":"baeaff2aaaeeb4f6ada9b838dd5e35340ce11e5c37635311f671dadb1337127b",".github/scripts/verify_release.py":"c309f50731fc05e0d09b22f5297a5864d764e9d9f12f6665e8387802cddc0cb6",".github/workflows/checks.yml":"3535211704fe419f9a4e9c0e6b792864775547a93a85f5fc51e45012377c3261",".github/workflows/pages-cloudflare.yml":"01ed78f89d2e1f304182fa460397c916a8d0fbc627a99840b98c75ac69f80f0c",".github/workflows/pages.yml":"6d9e485e8ee8582588be0082fa279d971cc124539d9a3f3b0d84bf942a115287","00-how-to-propose-an-amendment.md":"c4f4495a7d5494663956bfe9b38f369a88fb4555221408352864e49921197949","CODE_OF_CONDUCT.md":"0a2d939664e085358e447fe08268b8f71315089de32e7839c1637d6eff1cdc5d","CONTRIBUTING.md":"d9d35abb4ab7b517812b39e758f52904b2f6acb93575d0e26ef01a5fd3d4cbd5","CONTROL_FILES.json":"e568d7f8115451a384e4775f39f8ba83055ca1682bbdecfd129172432219badc","GOVERNANCE.md":"a4b48e2ded267260cf37446d7d4b596aea6e6c88e95eb57349cc332c7800c72b","LICENSE-CHARTER.md":"abdac5a9bc9a1db8219545ec16535e02d60cd8f452d7f5c1e56d344bd8fb4dd6","LICENSE-CODE.md":"31fdf5b6d1c4e0b8cae92af186305912455914068288374703960a9bc83ab71f","PROPOSALS.md":"6f587c7a85e2435695dbc3e8397a831ad90deec434e316186b6c6dd30d67f20b","PROVIDER_CONTRACT.json":"605ac80badb72661a01503c1d737b93c3dfa95e2124db0599401368db5df90ef","SETTLED.md":"f496219e38908f4d235dd3f1fe86ba38370c310f4364ed54e8e51c544986acd8","api-config.js":"d922912e29ad2518df23d6bce4eac07da7b0edf62c7435329632dec4a96490af","app.js":"6e93c461ac46eba67e11878cdd569f6bab733bb7fe4d7224b9d7a39010994fe1","charter-data.js":"bf9086d5c17865a5b65f983e820af6482b1602ffa5d6e424a1949c9cd336a923","favicon.png":"dc7619fd429c0b19e1c7b14e83655e095fc5cdef10524d4484aa77ea224d48ab","index.html":"d7d42c9b05f87682cdbd54a2f0b2cad8ed8665b2e64aa768043aa7156eb143e4","logo.png":"92dda85e9d96536d67459e087e9b55d81b212facaa070928e629ff7d5b55f504","markdown-renderer.js":"033db9862bc6ef10d4a1cf549bda40382ad02e340da87d3650d73b8e57b4e93f","pages_transport.cjs":"5fab26045c925ae4d8d3c94c0695a247c813b9c475de5dc430e6fb941cc39be5","proposal-client.js":"fa296503955aa4c4b358480653db223de507f29bc74527736e5202327c87ae02","publish_site.py":"532bdd9dbf06f33d399953d566bf40f362f516435caccc7e25745911e6b5743d","reaction-client.js":"b3546e0d956f7d5825c52d7cc4099b14db3935e42c6c47e7cdc9382ac1676a20","reaction-view.js":"6525a8e99863d7f59893ce1fe1f250dd8d97857db96d2ff3ca8f7832eeacd33d","release-manifest.json":"16959a928f106d4b27964903495eb618f0261ea0f6953a9558e0707f494bd34c","style.css":"0c58f2933be1d1c7e6e40340c03572acc75a71b380356fe66f065cc4139cf77d","vendor/blake3-wasm/LICENSE":"6ae51be712bd278ca37cd2204a6e836d71aacea5b7b8210d5a95c0e02a15dc35","vendor/blake3-wasm/dist/base/hash-fn.js":"ea96a6725f1b0281a59a643f9542a04678d35feb45a46924c59250fa3931c949","vendor/blake3-wasm/dist/node/hash-fn.js":"9bc8115f1a5a55115170afb9cc5d85cfd7f2c8a7e19bbfa363d81f265093dc85","vendor/blake3-wasm/dist/wasm/nodejs/blake3_js.js":"6be3f27f1efe8a8be162d16e060311f7ccf7c9f746e24c47acd43f25239131f2","vendor/blake3-wasm/dist/wasm/nodejs/blake3_js_bg.wasm":"2dcc96fd2bd25392060d166e96cabbd2574cc1fedd32aa0233871c641c897c9f","vendor/blake3-wasm/package.json":"f36864b59bcb76e6a97b7f236ad3ca78749af8374453ae1bcca048815b8c6e9e"}
          subject = Path(os.environ["GITHUB_WORKSPACE"]) / "control-subject"
          for name, digest in expected.items():
              entry = subject.joinpath(*name.split("/"))
              for component in (entry, *entry.parents):
                  if component.is_symlink(): raise RuntimeError("linked subject path")
                  if component == subject: break
              if not stat.S_ISREG(entry.lstat().st_mode) or hashlib.sha256(entry.read_bytes()).hexdigest() != digest: raise RuntimeError("subject source mismatch")
          temporary = Path(os.environ["RUNNER_TEMP"])
          if not temporary.is_absolute() or temporary.is_symlink(): raise RuntimeError("invalid runner temporary directory")
          destination = temporary / "hc-hosted-harness"
          destination.mkdir(mode=0o700, exist_ok=False)
          payloads = {"hosted_orchestration.py":{"base64":"","sha256":"d96e59c27a150e0567fae8d35e46d475ba4b41dca4f3678db07898f996cea6e0"},"node_hosted_child.cjs":{"base64":"","sha256":"abef451b9ebd178b8a252bde80be277c96cd900ca3696a51b41f463e328ac948"}}
          for name, payload in payloads.items():
              raw = base64.b64decode(payload["base64"], validate=True)
              if hashlib.sha256(raw).hexdigest() != payload["sha256"]: raise RuntimeError("harness source mismatch")
              with (destination / name).open("xb") as target:
                  target.write(raw)
                  target.flush()
                  os.fsync(target.fileno())
          HC_BOOTSTRAP
          python3 -I -S -B "$RUNNER_TEMP/hc-hosted-harness/hosted_orchestration.py" --control-root "$GITHUB_WORKSPACE/control-subject" --checkout "$GITHUB_WORKSPACE/control-subject" --evidence-root "$RUNNER_TEMP/hc-hosted-evidence" --node "$(command -v node)"
